<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💘 深度恋爱人格测试</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="home-page" class="page active">
        <div class="card">
            <h1>💘 深度恋爱人格测试</h1>
            <p>10题，测出你在感情里的真实内核</p>
            <button id="start-btn">开始测试</button>
        </div>
    </div>

    <div id="quiz-page" class="page">
        <div class="card">
            <div class="progress">
                <div id="bar"></div>
            </div>
            <h2 id="question"></h2>
            <div id="options"></div>
        </div>
    </div>

    <div id="result-page" class="page">
        <div class="card result">
            <h1 id="result-title"></h1>
            <img id="result-img">
            <p id="result-desc"></p>
            <div class="info">
                <div id="result-advantage"></div>
                <div id="result-shadow"></div>
                <div id="result-quote"></div>
            </div>
            <div class="btns">
                <button id="restart-btn">重新测试</button>
                <button id="share-btn">分享好友</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
